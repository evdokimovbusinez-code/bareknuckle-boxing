<style>

  color-scheme:dark;
}
html,body{height:100%}
body{background:var(--ink);color:var(--text);font-family:var(--body);overflow:hidden;-webkit-font-smoothing:antialiased}
#c{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;outline:none}

.top{display:flex;flex-direction:column;gap:10px;max-width:min(420px,100%)}
.eyebrow{font-family:var(--mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--gold)}

.stage{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;margin:0;font-family:var(--mono);font-size:11.5px;font-variant-numeric:tabular-nums;color:var(--muted);

  const wq = new Quat();
  if (p) { wq.copy(p.tw); bone.quaternion.copy(parentQ).invert().multiply(wq); }
  else wq.copy(parentQ).multiply(bone.quaternion);
  for (const c of bone.children) if (c.isBone) walk(c, wq);
}

/* ───────── punch sequencing ───────── */
const SPEED = 1.15;
const PUNCH = { jab: { chain: 0.82, name: 'джеб' }, cross: { chain: 1.12, name: 'кросс' }, upper: { chain: 1.18, name: 'апперкот' }, hook: { chain: 1.05, name: 'хук' } };
const COMBOS = [['jab'], ['jab', 'cross'], ['jab', 'cross', 'upper'], ['jab', 'jab', 'cross'], ['cross', 'hook'], ['jab', 'upper'], ['hook', 'cross']];
let cur = null, curName = '', returning = false, queue = [], autoOn = !window.matchMedia('(prefers-reduced-motion: reduce)').matches, nextAuto = 1.2, clock = 0, timeScale = 1;
const elMove = $('s-move');
function startPunch(name) {
  const a = A[name], from = cur || A.idle;
  a.reset(); a.setEffectiveTimeScale(SPEED); a.setEffectiveWeight(1); a.play();
  a.crossFadeFrom(from, cur ? 0.16 : 0.14, false);
  cur = a; curName = name; returning = false; elMove.textContent = PUNCH[name].name;
}
function sequence() {
  if (cur) {
    const t = cur.time, dur = cur.getClip().duration;
    if (queue.length && t >= PUNCH[curName].chain) startPunch(queue.shift());
    else if (!returning && t >= dur - 0.34) { A.idle.reset().play(); A.idle.crossFadeFrom(cur, 0.3, false); returning = true; }
    else if (returning && (t >= dur || cur.getEffectiveWeight() <= 0.001)) { cur = null; elMove.textContent = 'стойка'; nextAuto = clock + 0.6 + rnd() * 1.1; }
  } else {
    if (queue.length) startPunch(queue.shift());
    else if (autoOn && clock > nextAuto) queue.push(...COMBOS[(rnd() * COMBOS.length) | 0]);
  }
}

/* ───────── loop ───────── */
let last = performance.now(), fpsT = 0, fpsN = 0;
const elFps = $('s-fps');
function loop(now) {
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  const sdt = dt * timeScale; clock += sdt;
  sequence();
  mixer.update(sdt);
  retarget();
  simulate(sdt);
  controls.update();
  composer.render();
  fpsN++; fpsT += dt; if (fpsT > 0.5) { elFps.textContent = `${Math.round(fpsN / fpsT)} к/с`; fpsN = 0; fpsT = 0; }
  requestAnimationFrame(loop);
}

build().then(() => {
  $('loading').hidden = true;
  retarget(); simulate(0);
  requestAnimationFrame(t => { last = t; loop(t); });
}).catch(e => { console.error(e); ldText.textContent = 'Не удалось загрузить модель. Обнови страницу.'; ldText.className = 'err'; });

/* ───────── UI ───────── */
const tAuto = $('t-auto'), tSlow = $('t-slow');
const setAuto = v => { autoOn = v; tAuto.setAttribute('aria-pressed', String(v)); if (v) nextAuto = clock + 0.3; };
setAuto(autoOn);
const setSlow = v => { timeScale = v ? 0.25 : 1; tSlow.setAttribute('aria-pressed', String(v)); };
function fire(name) {
  if (!mixer) return;
  setAuto(false);
  if (queue.length > 3) return;
  if (name === 'combo') queue.push('jab', 'cross', 'upper'); else queue.push(name);
}
document.querySelectorAll('.mv').forEach(b => b.addEventListener('click', () => fire(b.dataset.move)));
tAuto.addEventListener('click', () => setAuto(tAuto.getAttribute('aria-pressed') !== 'true'));
tSlow.addEventListener('click', () => setSlow(tSlow.getAttribute('aria-pressed') !== 'true'));
window.addEventListener('keydown', e => {
  if (e.repeat || e.metaKey || e.ctrlKey) return;
  const k = e.key.toLowerCase();
  if (k === '1') fire('jab'); else if (k === '2') fire('cross'); else if (k === '3') fire('upper'); else if (k === '4') fire('hook');
  else if (k === ' ') { e.preventDefault(); fire('combo'); }
  else if (k === 's' || k === 'ы') setSlow(tSlow.getAttribute('aria-pressed') !== 'true');
});
</script>

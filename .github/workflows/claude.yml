name: Claude Code
# @claude in an issue (title or body), an issue comment, a PR comment or a PR review starts the bot.
# It runs on the ANTHROPIC_API_KEY repository secret, so it spends API credits, not the Claude subscription.
on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened, assigned]
  pull_request_review:
    types: [submitted]

concurrency:
  group: claude-${{ github.event.issue.number || github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  claude:
    if: |
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude')) ||
      (github.event_name == 'issues' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')))
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: anthropics/claude-code-action@v1
        id: claude
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          track_progress: true
          claude_args: >-
            --model claude-sonnet-5-5
            --max-turns 60
            --allowedTools "Edit,MultiEdit,Write,Bash(python3 src/assemble.py),Bash(bash tools/check.sh),Bash(node --check:*),Bash(grep:*),Bash(sed -n:*),Bash(wc:*)"
      # on failure print only Claude's final message (e.g. an API error), never the full transcript
      - name: Show Claude error
        if: failure()
        run: |
          f=/home/runner/work/_temp/claude-execution-output.json
          [ -f "$f" ] && jq -r '[.[] | select(.type=="result")][-1].result // "no result message"' "$f" || echo "no execution output"

name: Claude bot
# "@claude ..." in a new issue or in a comment (issue or PR) from the repo owner/collaborators starts the bot.
# It runs Claude Fable 5.2 (effort high) through the Agent SDK on the ANTHROPIC_API_KEY secret (API credits), works on branch claude/issue-N
# (or the PR's own branch), runs tools/check.sh, pushes, opens/updates a PR and reports back in the thread.
on:
  issues:
    types: [opened]
  issue_comment:
    types: [created]

concurrency:
  group: claude-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  bot:
    if: |
      contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event_name == 'issues' && github.event.issue.author_association || github.event.comment.author_association) &&
      ((github.event_name == 'issues' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude'))) ||
       (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')))
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
      pull-requests: write
      issues: write
    env:
      GH_TOKEN: ${{ github.token }}
      N: ${{ github.event.issue.number }}
      IS_PR: ${{ github.event.issue.pull_request && 'yes' || 'no' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Pick branch
        id: br
        run: |
          git config user.name "claude-bot"; git config user.email "claude-bot@users.noreply.github.com"
          if [ "$IS_PR" = yes ]; then B=$(gh pr view "$N" --json headRefName -q .headRefName); else B="claude/issue-$N"; fi
          if git ls-remote --exit-code --heads origin "$B" >/dev/null; then git checkout -B "$B" "origin/$B"; else git checkout -b "$B"; fi
          # the bot's own tooling always comes from main (an older task branch may carry stale copies)
          git checkout origin/main -- tools CLAUDE.md .gitignore
          echo "b=$B" >> "$GITHUB_OUTPUT"
          gh issue comment "$N" --body "🤖 Взял задачу, работаю в ветке \`$B\`… [ход работы](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})"
      - name: Build prompt
        run: |
          {
            echo "You are the coding bot of this repository (bare-knuckle boxing browser game). Read CLAUDE.md first and follow it."
            echo "Do the task from GitHub #$N below (the latest @claude message is the current request; earlier messages are context)."
            echo "Rules: edit sources in src/ (never index.html by hand), then run 'bash tools/check.sh' and fix until it prints OK."
            echo "For anything visual (models, clothes, locations, UI, lighting) LOOK at your result: 'bash tools/shot.sh /tmp/shots/NAME.jpg fight 4' (or menu / js \"CODE\"), then Read the JPG. Iterate until it looks right. Mention in the summary what you checked visually. (If your model cannot view images, still take the shots and list their paths — the reviewer looks at them.)"
            echo "This branch may already hold earlier (partial) work on this task: check 'git log --oneline origin/main..HEAD' and 'git diff origin/main --stat' first and continue from it."
            echo "Do not run git commands that change history (no commit/push/checkout) - the workflow commits for you."
            echo "Finish by writing a short summary IN RUSSIAN to .claude-summary.md: what changed, which functions, how to see it in the game, anything left undone."
            echo; echo "=== #$N: $(gh issue view "$N" --json title -q .title) ==="
            gh issue view "$N" --json body -q .body
            echo; echo "=== Discussion ==="
            gh api "repos/${{ github.repository }}/issues/$N/comments" --paginate --jq '.[] | select(.user.type != "Bot") | "--- \(.user.login):\n\(.body)\n"'
          } > /tmp/prompt.md
      - name: Run Claude
        env:
          ANTHROPIC_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENROUTER_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          # model: GLM-5.3-Flash through OpenRouter by default (cheap); a tag in the issue title picks another:
          # [ds] = DeepSeek V4.1 Flash, [mimo] = MiMo-V2.6-Pro, [glm-x] = GLM-5.3-FlashX, [sonnet] / [opus] / [fable] = Claude through the Anthropic API key
          BOT_MODEL: ${{ contains(github.event.issue.title, '[fable]') && 'claude-fable-5-2' || contains(github.event.issue.title, '[sonnet]') && 'claude-sonnet-5-5' || contains(github.event.issue.title, '[opus]') && 'claude-opus-5-5' || contains(github.event.issue.title, '[ds]') && 'deepseek/deepseek-v4.1-flash' || contains(github.event.issue.title, '[mimo]') && 'xiaomi/mimo-v2.6-pro' || contains(github.event.issue.title, '[glm-x]') && 'z-ai/glm-5.3-flashx' || 'z-ai/glm-5.3-flash' }}
          BOT_EFFORT: high
          BOT_BUDGET: "8"               # hard cap per task, USD (Claude models; OpenRouter spend is capped by the key's own limit)
        run: |
          pip install -q claude-agent-sdk playwright
          npm i --no-save --silent three@0.160.0 cannon-es@0.20.0
          if [[ "$BOT_MODEL" == claude-* ]]; then
            export ANTHROPIC_API_KEY="$ANTHROPIC_KEY"
          else   # OpenRouter speaks the Anthropic API: the SDK runs any of its models
            export ANTHROPIC_BASE_URL="https://openrouter.ai/api" ANTHROPIC_AUTH_TOKEN="$OPENROUTER_KEY" ANTHROPIC_API_KEY=""
            export ANTHROPIC_DEFAULT_HAIKU_MODEL="$BOT_MODEL" ANTHROPIC_SMALL_FAST_MODEL="$BOT_MODEL" BOT_EFFORT=""
          fi
          python tools/agent.py /tmp/prompt.md
      - name: Commit, push, PR
        if: always()
        run: |
          B="${{ steps.br.outputs.b }}"
          RES=$(jq -r 'if .is_error then "❌ Ошибка: " + .result else "" end' .claude-result.json 2>/dev/null || echo "❌ Бот упал, см. лог")
          COST=$(jq -r '"$" + ((.cost*1000|round)/1000|tostring) + ", ходов: " + (.turns|tostring) + ", модель: " + (.model // "?")' .claude-result.json 2>/dev/null || echo "?")
          SUM=$(cat .claude-summary.md 2>/dev/null || echo "")
          rm -f .claude-summary.md .claude-result.json
          if [ -n "$(git status --porcelain)" ]; then
            if bash tools/check.sh >/tmp/check.txt 2>&1; then CHK="✅ сборка и проверка синтаксиса прошли"; else CHK="⚠️ tools/check.sh не прошёл: $(tail -3 /tmp/check.txt)"; fi
            git add -A; git commit -qm "Claude bot: #$N" -m "$(echo "$SUM" | head -20)"; git push -q -u origin "$B"
            PR=$(gh pr list --head "$B" --state open --json url -q '.[0].url')
            if [ -z "$PR" ]; then
              PR=$(gh pr create --head "$B" --base main --title "$(gh issue view "$N" --json title -q .title)" --body "$(printf 'Closes #%s\n\n%s\n\n%s' "$N" "$SUM" "$CHK")" 2>/dev/null) || PR="ветка \`$B\` (PR откроет Claude или: ${{ github.server_url }}/${{ github.repository }}/compare/main...$B?expand=1)"
            fi
            MSG=$(printf '%s\n\n%s\n\n**PR:** %s\n%s\nСтоимость: %s' "$RES" "$SUM" "$PR" "$CHK" "$COST")
          else
            MSG=$(printf '%s\n\n%s\n\nИзменений в коде нет. Стоимость: %s' "$RES" "$SUM" "$COST")
          fi
          gh issue comment "$N" --body "$MSG"
